name: Feature request
description: Suggest a new macro, API improvement, or documentation enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **BDUT** deliberately stays minimal. Please explain why a simpler workaround is insufficient.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to test or achieve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: API sketch, macro name, or doc change
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other test libraries, manual checks, or local wrappers
